<!DOCTYPE html>
<html lang="en">
<head>
  <title>Hán Tự Kanji Hack Não BK</title>
  <meta charset="utf-8">
  <meta name="description" content="Giúp bạn học Kanji, hán tự dễ dàng bằng việc kết hợp hình ảnh và câu chuyện. Tìm hiểu cách áp dụng phương pháp này để nâng cao khả năng học Kanji của bạn.">
  <meta name="keywords" content="phương pháp học hiệu quả, tiếng nhật, hack não, kanji, hán tự, kanji qua hình ảnh, học nhanh, nhớ lâu">
  <meta name="application-name" content="Hack Não BK Tiếng Nhật">
  <meta name="author" content="Hack Nao BK">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Hán Tự Kanji Hack Não BK">
  <meta property="og:type" content="article" />
  <meta property="og:description" content="Giúp bạn học Kanji, hán tự dễ dàng bằng việc kết hợp hình ảnh và câu chuyện. Tìm hiểu cách áp dụng phương pháp này để nâng cao khả năng học Kanji của bạn.">
  <meta property="og:image" content="https://nhotuvung.io.vn/image/icon.png">
  <meta property="og:url" content="https://nhotuvung.io.vn/kanji.html">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
  <script src="common.js"></script>
  <script src="navbar.js"></script>
  <link rel="stylesheet" href="mystyle.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
  <link href="https://unpkg.com/vis-network/styles/vis-network.min.css" rel="stylesheet" type="text/css" />
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <script>
    $(document).ready(function(){
      searchWordKanji();
      setDefaultMyname();
    });

    function renderRadicalsVisjs() {
      const wordId = document.getElementById('word_id').textContent || document.getElementById('word_id').value;
      if (!wordId) return;

      const url = `https://nguyenthithom.name.vn/api/char/${wordId}/radicals-tree`;
      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (!data.nodes || !data.links) {
            document.getElementById('radicals_visjs_chart').innerText = 'Không có dữ liệu bộ thủ.';
            return;
          }
          const container = document.getElementById('radicals_visjs_chart');
          const radicalsContainer = document.getElementById('radicals_visjs');
          const width = radicalsContainer.offsetWidth || 600; // fallback nếu chưa render xong
          const rootX = -width / 4;

          // Khi tạo node gốc:
          // Helper: create an SVG circle with radial gradient and centered label, returned as data URI
          function makeNodeSVG(label, size, colorA, colorB, fontSize) {
            const w = size;
            const h = size;
            const svg = `<?xml version='1.0' encoding='UTF-8'?>
              <svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'>
                <defs>
                  <radialGradient id='g' cx='40%' cy='35%'>
                    <stop offset='0%' stop-color='${colorA}' stop-opacity='1' />
                    <stop offset='100%' stop-color='${colorB}' stop-opacity='1' />
                  </radialGradient>
                  <filter id='f' x='-50%' y='-50%' width='200%' height='200%'>
                    <feDropShadow dx='0' dy='4' stdDeviation='6' flood-color='rgba(0,0,0,0.18)'/>
                  </filter>
                </defs>
                <circle cx='${w/2}' cy='${h/2}' r='${Math.floor(w/2 - 2)}' fill='url(#g)' filter='url(#f)' />
                <text x='50%' y='55%' font-family='Inter, Arial, sans-serif' font-size='${fontSize}' fill='white' text-anchor='middle' dominant-baseline='middle'>${label}</text>
              </svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
          }

          // Palette to assign varying gradients for nodes
          const palette = [ ['#6cc4fa','#3a9ef0'], ['#f6a0e6','#f66cfa'], ['#ffd37f','#ff9a5b'], ['#9be7c4','#4dd09b'], ['#c5b6ff','#8f6bff'] ];

          const nodes = data.nodes.map((n, idx) => {
            const isRoot = (n.id == wordId);
            const pal = palette[idx % palette.length];
            // Reduce diameter to one third of previous values to avoid overlap
            const baseSize = isRoot ? 140 : 88;
            const size = Math.max(20, Math.round(baseSize / 3));
            const fontSize = isRoot ? Math.max(14, Math.floor(size * 0.45)) : Math.max(10, Math.floor(size * 0.34));
            const image = makeNodeSVG(n.label || '', size, pal[0], pal[1], fontSize);

            const nodeObj = {
              id: n.id,
              label: n.label,
              note: n.note,
              reading: n.reading,
              meaning: n.meaning,
              shape: 'circularImage',
              image: image,
              size: size,
              borderWidth: isRoot ? 2 : 1
            };

            // Keep root fixed position
            if (isRoot) {
              nodeObj.x = rootX;
              nodeObj.y = 0;
              nodeObj.fixed = { x: true, y: true };
            }
            return nodeObj;
          });
          const edges = data.links.map(l => ({
            from: l.source,
            to: l.target
          }));

          document.getElementById('radicals_visjs_chart').innerHTML = "";

          // For display, pass nodes without visible `label` (labels are baked into the SVG images)
          const visNodes = nodes.map(n => Object.assign({}, n, { label: '' }));
          const networkData = { nodes: new vis.DataSet(visNodes), edges: new vis.DataSet(edges) };
          const options = {
            nodes: {
              // labels are baked into the images; keep default
              font: { face: 'Inter, Arial, sans-serif' }
            },
            edges: {
              arrows: 'to',
              smooth: { type: 'dynamic' },
              length: 100
            },
            physics: {
              stabilization: true,
              barnesHut: {
                gravitationalConstant: -2000,
                centralGravity: 0.3,
                springLength: 120,
                springConstant: 0.04,
                damping: 0.09
              }
            }
          };

          const network = new vis.Network(container, networkData, options);

          // Adjust chart height based on number of nodes
          if (nodes.length >= 8) {
            radicalsContainer.style.height = '550px'; // 1.5x original height
          } else {
            radicalsContainer.style.height = '300px'; // original height
          }

          // Đặt node gốc ở 1/3 bên trái
          network.moveTo({
            position: { x: rootX, y: 0 },
            scale: 1,
            offset: { x: 0, y: 0 },
            animation: false
          });

          // Tooltip khi click node
          let tooltipDiv = document.getElementById('visjs-tooltip');
          if (!tooltipDiv) {
            tooltipDiv = document.createElement('div');
            tooltipDiv.id = 'visjs-tooltip';
            tooltipDiv.style.position = 'absolute';
            tooltipDiv.style.display = 'none';
            tooltipDiv.style.background = 'rgba(255,255,200,0.98)';
            tooltipDiv.style.border = '1px solid #888';
            tooltipDiv.style.padding = '8px';
            tooltipDiv.style.borderRadius = '6px';
            tooltipDiv.style.zIndex = 1000;
            document.body.appendChild(tooltipDiv);
          }
          const chartElement = document.getElementById('radicals_visjs_chart');
          network.on("click", function (params) {
            if (params.nodes.length > 0) {
              const nodeId = params.nodes[0];
              const node = nodes.find(n => n.id == nodeId);
              if (node) {
                // Tạo nội dung tooltip với reading và meaning trên 1 dòng, note ở dòng dưới
                let readingMeaning="";
                if(node.reading || node.meaning){
                  readingMeaning = (node.reading || '') + ': ' + (node.meaning || '');
                }
                const note = node.note || '';
                tooltipDiv.innerHTML = 
                  `<div>${readingMeaning}</div>` +
                  `<div style="margin-top:4px;">${note.replace(/\n/g, "<br>")}</div>`;
                tooltipDiv.style.display = 'block';
                
                // Get node position and convert to DOM coordinates
                const pos = network.getPositions([nodeId]);
                const canvasPos = network.canvasToDOM(pos[nodeId]);
                
                // Get the radicals_visjs container position
                const container = document.getElementById('radicals_visjs');
                const containerRect = container.getBoundingClientRect();
                
                // Calculate tooltip position relative to the container
                const tooltipWidth = tooltipDiv.offsetWidth;
                const tooltipHeight = tooltipDiv.offsetHeight;
                const nodeSize = node.size || 30;
                
                // Calculate position relative to the container
                let left = containerRect.left + canvasPos.x - (tooltipWidth / 2);
                let top = containerRect.top + canvasPos.y - tooltipHeight - nodeSize;
                
                // Ensure tooltip stays within viewport
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;
                
                // Adjust horizontal position if tooltip would go off screen
                if (left < 0) {
                  left = 0;
                } else if (left + tooltipWidth > viewportWidth) {
                  left = viewportWidth - tooltipWidth;
                }
                
                // If tooltip would go above viewport, show it below the node instead
                if (top < 0) {
                  top = containerRect.top + canvasPos.y + nodeSize;
                }
                
                tooltipDiv.style.left = left + 'px';
                tooltipDiv.style.top = top + 'px';
              }
            } else {
              tooltipDiv.style.display = 'none';
            }
          });

          network.on("dragStart", function () {
            tooltipDiv.style.display = 'none';
          });
          container.addEventListener('mouseleave', function() {
            tooltipDiv.style.display = 'none';
          });

            // Hiển thị thông tin các bộ thủ
          const infoDiv = document.getElementById('radicals_info');
          if (infoDiv) {
            let html = '';
            if (nodes.length >= 8) {
              // Create 2 columns layout
              const midPoint = Math.ceil(data.nodes.length / 2);
              html = '<div class="row"><div class="col-sm-6">';
              
              // First column
              for (let i = 0; i < midPoint; i++) {
                const n = data.nodes[i];
                const label = n.label || '';
                const reading = n.reading || '';
                const meaning = n.meaning || '';
                const note = n.note || '';
                html += `<div><b>${label}: ${reading} - ${meaning}</b></div>`;
                html += `<div style="margin-bottom:1em;">${note.replace(/\n/g, "<br>")}</div>`;
              }
              
              html += '</div><div class="col-sm-6">';
              
              // Second column
              for (let i = midPoint; i < data.nodes.length; i++) {
                const n = data.nodes[i];
                const label = n.label || '';
                const reading = n.reading || '';
                const meaning = n.meaning || '';
                const note = n.note || '';
                html += `<div><b>${label}: ${reading} - ${meaning}</b></div>`;
                html += `<div style="margin-bottom:1em;">${note.replace(/\n/g, "<br>")}</div>`;
              }
              
              html += '</div></div>';
            } else {
              // Single column layout for less than 8 nodes
              data.nodes.forEach(n => {
                const label = n.label || '';
                const reading = n.reading || '';
                const meaning = n.meaning || '';
                const note = n.note || '';
                html += `<div><b>${label}: ${reading} - ${meaning}</b></div>`;
                html += `<div style="margin-bottom:1em;">${note.replace(/\n/g, "<br>")}</div>`;
              });
            }
            infoDiv.innerHTML = html;
          }
        })
        .catch(() => {
          document.getElementById('radicals_visjs_chart').innerText = 'Không thể tải biểu đồ bộ thủ.';
        });
    }

    // Gọi lại khi từ Kanji thay đổi
    const origSetWordDetail = window.setWordDetail;
    window.setWordDetail = function() {
      origSetWordDetail.apply(this, arguments);
      renderRadicalsVisjs();
    };
    // Nếu trang load lần đầu đã có id
    document.addEventListener('DOMContentLoaded', function() {
      renderRadicalsVisjs();
    });
  </script>
</head>
<body>

<div id="navbar"></div>

<div class="container-fluid">
  <div class="row content">
    <div class="col-md-4 col-lg-3 sidenav">
      <div class="sticky-sidebar">
        <div class="page_title">
          <h2 id="pageheadersp">Tìm kiếm Hán tự, Kanji tiếng Nhật</h2>
        </div>

        <div class="card mb-3">
          <div class="card-body p-2 search-sticky">
            <div class="input-group" style="margin-top: 6px;">
              <input type="text" class="form-control" required placeholder="VD:花 はな hoa" id="input_keyword" onkeyup="inputKeywordListenerKanji();">
              <div class="input-group-append">
                <button class="btn btn-primary" type="submit" onclick="searchWordKanji();" id="btn_search"><i class="fas fa-search"></i></button>
              </div>
            </div>
          </div>
        </div>

        <div id="result_list" class="result-list card" style="overflow: auto;">
          <div class="card-body p-2">
            <table id="myTable" class="table table-hover mb-0">
              <colgroup>
                <col span="1" style="width: 30%;">
                <col span="1" style="width: 70%;">
              </colgroup>
              <tbody id="word_table" style="font-size: small;"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-8 col-lg-9">
      <div class="page_title mb-2">
        <h1 id="pageheaderpc">Tìm kiếm Hán tự, Kanji tiếng Nhật</h1>
      </div>

      <div style="display:none" id="word_id"></div>
      <div style="display:none" id="word_next"></div>
      <div style="display:none" id="word_prev"></div>

      <div class="card mb-3 word-card">
        <div class="card-body">
          <div class="d-flex flex-column flex-lg-row align-items-start">
            <div class="flex-grow-1 pr-lg-3">
              <div class="d-flex flex-column">
                <div id="word_reading" class="word_readingstl sp-center" style="width: 100%; margin-bottom:8px;"></div>
                <div id="word_text" class="kanji_textstl sp-center" style="width: 100%;"></div>

                <div class="word-subtitle">Nghĩa</div>
                <div id="word_meaning" class="word_meaningstl word-meaning-block" style="margin-top:6px;"></div>

                <div class="word-subtitle" style="margin-top:10px;">Cách Nhớ</div>
                <div id="word_note" class="word_notestl" style="margin-top:6px;"></div>

                <div class="word-subsection" style="margin-top:12px;">
                  <div class="word-subtitle">Âm kun</div>
                  <div id="word_kun" class="word_meaningstl"></div>
                </div>

                <div class="word-subsection" style="margin-top:8px;">
                  <div class="word-subtitle">Âm On</div>
                  <div id="word_on" class="word_meaningstl"></div>
                </div>
              </div>
            </div>

            <div class="word-image-wrapper mt-3 mt-lg-0 ml-lg-3" style="max-width: 40%;">
              <img id="word_image" src="image/default.jpg" alt="new word" class="img-fluid rounded" style="max-height:250px;">
            </div>
          </div>
        </div>
      </div>

      <!-- Radicals visualization placed below the main card as a full-width row -->
      <div class="row">
        <div id="radicals_visjs" class="col-12" style="height: 300px;">
          <div id="radicals_visjs_chart" style="width: 100%; height: 100%;"></div>
        </div>
        <div id="radicals_info" class="col-12 mt-3" style="white-space: pre-line; font-size: x-small; overflow-y: auto; max-height: 200px;"></div>
      </div>

      <div id="commentsCollapse" style="display: none;">
        <div id="div_comment" style="height: 320px; overflow: auto;">
          <p id="comment_title">Comment:</p>
          <div class="mt-3">
            <table id="table_comment" class="table table-striped mb-0">
              <colgroup>
                <col span="1" style="width: 84%;">
                <col span="1" style="width: 16%;">
              </colgroup>
              <tbody style="font-size: small;">
                <tr>
                  <td class="col-10" style="font-size: small; text-align: left;">Nội dung comment</td>
                  <td class="col-2" style="font-size: xx-small; text-align: right;">Tác giả</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="mt-2 comment-input-area">
          <div class="input-group input-row">
            <input type="text" name="mycomment" id="mycomment" class="form-control" placeholder="Góp ý của bạn">
            <div class="input-group-append">
              <button class="btn btn-primary" type="submit" onclick="submitComment();"><i class="fa fa-paper-plane"></i></button>
            </div>
          </div>
          <input type="text" id="myname" class="form-control comment-name mt-2" placeholder="メンバー" onchange="saveMyName(this.value)">
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

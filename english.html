<!DOCTYPE html>
<html lang="en">
<head>
  <title>Tìm Từ Vựng Tiếng Anh Hack Não BK</title>
  <link rel="icon" type="image/x-icon" href="https://nhotuvung.io.vn/favicon.ico">
  <meta charset="utf-8">
  <meta name="description" content="Helps you remember English vocabulary quickly and for a long time. Learn how to study and memorize new words effectively.">
  <meta name="keywords" content="effective learning methods, English, hack não, vocabulary through images, learn fast, remember long">
  <meta name="application-name" content="Hack Não BK English">
  <meta name="author" content="Hack Nao BK">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="English Vocabulary Hack Não BK">
  <meta property="og:type" content="article" />
  <meta property="og:description" content="Helps you remember English vocabulary quickly and for a long time. Learn how to study and memorize new words effectively.">
  <meta property="og:image" content="https://nhotuvung.io.vn/image/icon.png">
  <meta property="og:url" content="https://nhotuvung.io.vn/english.html">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
  <script src="common.js"></script>
  <script src="navbar.js"></script>
  <link rel="stylesheet" href="mystyle.css">

  <script>
    $(document).ready(function(){
      searchWordEnglish();
      setDefaultMyname();
    });
  </script>
</head>
<body>

<div id="navbar"></div>

<div class="container-fluid">
  <div class="row content">
    <div class="col-md-4 col-lg-3 sidenav">
      <div class="sticky-sidebar">
        <input type="hidden" id="word_type" name="word_type" value="0">
        <div class="page_title">
          <h2 id="pageheadersp">Tìm Từ Vựng Tiếng Anh</h2>
        </div>

        <div class="card mb-3">
          <div class="card-body p-2 search-sticky">
            <div class="input-group" style="margin-top: 6px;">
              <input type="text" class="form-control" required placeholder="e.g., flower" id="input_keyword" onkeyup="inputKeywordListenerEnglish();">
              <div class="input-group-append">
                <button class="btn btn-primary" type="submit" onclick="searchWordEnglish();" id="btn_search"><i class="fas fa-search"></i></button>
              </div>
            </div>
          </div>
        </div>

        <div id="result_list" class="result-list card vocabulary-list-card" style="overflow: auto;">
          <div class="card-body p-2">
            <table id="myTable" class="table table-hover mb-0 vocabulary-word-table">
              <colgroup>
                <col span="1" style="width: 30%;">
                <col span="1" style="width: 70%;">
              </colgroup>
              <tbody id="word_table" style="font-size: small;"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-8 col-lg-9">
      <div class="page_title mb-2">
        <h1 id="pageheaderpc">Tìm Từ Vựng Tiếng Anh</h1>
      </div>

      <div style="display:none" id="word_id"></div>
      <div style="display:none" id="word_next"></div>
      <div style="display:none" id="word_prev"></div>

      <div class="card mb-3 word-card">
        <div class="card-body">
          <div class="d-flex flex-column flex-lg-row align-items-start">
            <div class="flex-grow-1 pr-lg-3">
              <div class="d-flex align-items-center word-meta">
                <div id="word_reading" class="word_readingstl"></div>
                <div id="word_pos" class="word_pos ml-2"></div>
              </div>
              <div id="word_text" class="word_textstl mt-2"></div>
              <div id="word_meaning" class="word_meaningstl mt-2"></div>
              <div id="word_note" class="word_notestl mt-2"></div>

              <div class="mt-3"></div>
            </div>

            <div class="word-image-wrapper mt-3 mt-lg-0 ml-lg-3" style="max-width: 40%;">
              <img id="word_image" src="image/default.jpg" alt="new word" class="img-fluid rounded">
            </div>
          </div>
        </div>
      </div>

      <div id="commentsCollapse" style="display: none;">
        <div id="div_comment">
          <p id="comment_title">Comment:</p>
          <div class="mt-3">
            <table id="table_comment" class="table table-striped mb-0">
              <colgroup>
                <col span="1" style="width: 84%;">
                <col span="1" style="width: 16%;">
              </colgroup>
              <tbody style="font-size: small;">
                <tr>
                  <td class="col-10" style="font-size: small; text-align: left;">Nội dung comment</td>
                  <td class="col-2" style="font-size: xx-small; text-align: right;">Tác giả</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="mt-2 comment-input-area">
          <div class="input-group input-row">
            <input type="text" name="mycomment" id="mycomment" class="form-control" placeholder="Góp ý của bạn">
            <div class="input-group-append">
              <button class="btn btn-primary" type="submit" onclick="submitComment();"><i class="fa fa-paper-plane"></i></button>
            </div>
          </div>
          <input type="text" id="myname" class="form-control comment-name mt-2" placeholder="メンバー" onchange="saveMyName(this.value)">
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <title>English Vocabulary Hack Não BK</title>
  <link rel="icon" type="image/x-icon" href="https://hacknaobk.icu/favicon.ico">
  <meta charset="utf-8">
  <meta name="description" content="Helps you remember English vocabulary quickly and for a long time. Learn how to study and memorize new words effectively.">
  <meta name="keywords" content="effective learning methods, English, hack não, vocabulary through images, learn fast, remember long">
  <meta name="application-name" content="Hack Não BK English">
  <meta name="author" content="Hack Nao BK">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="English Vocabulary Hack Não BK">
  <meta property="og:type" content="article" />
  <meta property="og:description" content="Helps you remember English vocabulary quickly and for a long time. Learn how to study and memorize new words effectively.">
  <meta property="og:image" content="https://hacknaobk.icu/image/icon.png">
  <meta property="og:url" content="https://hacknaobk.icu/english.html">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
  <script src="common.js"></script>
  <script src="navbar.js"></script>
  <link rel="stylesheet" href="mystyle.css">

  <script>
    localStorage.setItem('selected_language', 'English');
    $(document).ready(function(){
      updateBrandLogo();
      searchWordEnglish();
      setIndicator();
    });
  </script>
</head>
<body>

<div id="navbar"></div>

<div class="container-fluid">
  <div class="row content">
    <div class="col-sm-3 sidenav">
      <input type="hidden" id="word_type" name="word_type" value="0">
      <div class="page_title">
        <h2 id="pageheadersp">Search Vocabulary</h2>
      </div>
      <div class="input-group mb-3" style="margin-top: 10px;">
        <input type="text" class="form-control" required placeholder="e.g., flower" id="input_keyword" onkeyup="inputKeywordListenerEnglish();">
        <div class="input-group-append">
          <button class="btn btn-primary" type="submit" onclick="searchWordEnglish();" id="btn_search"><i class="fas fa-search"></i></button>
        </div>
      </div>
      <div id="result_list" style="overflow: auto;">
        <table id="myTable" class="table table-hover">
          <colgroup>
            <col span="1" style="width: 30%;">
            <col span="1" style="width: 70%;">
          </colgroup>
          <tbody id="word_table" style="font-size: small;">
          </tbody>
        </table>
      </div>
    </div>

    <div class="col-sm-9">
      <div id="wait"><img src='image/loading.gif' alt="Hack Não BK loading" style="position:absolute;width: 10%;display: block;top:0%;left:45%;"/></div>
      <div class="page_title">
        <h1 id="pageheaderpc">Search Vocabulary</h1>
      </div>
      <div style="display:none" id="word_id"></div>
      <div style="display:none" id="word_next"></div>
      <div style="display:none" id="word_prev"></div>
      <div style="width: 100%;display: block;">
        <div id="word_reading" class="word_readingstl"></div>
        <div id="word_text" class="word_textstl"></div>
        <div id="word_meaning" class="word_meaningstl"></div>
        <div id="word_note" class="word_notestl"></div>
      </div>
      <img id="word_image" src="image/default.jpg" alt="new word" style="max-height: 400px;max-width: 100%; height: auto;">
      <div id="div_comment" style="height: 400px; overflow: auto;">
        <p id="comment_title">Comment:</p>
        <input type="text" name="mycomment" id="mycomment" class="form-control" placeholder="Your feedback"><br>
        <button class="btn btn-primary" type="submit" onclick="submitComment();"><i class="fa fa-paper-plane"></i></button>
        <table id="table_comment" class="w3-table w3-bordered">
          <colgroup>
            <col span="1" style="width: 80%;">
            <col span="1" style="width: 20%; font-size: x-small;">
          </colgroup>
          <tbody style="font-size: small;">
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>

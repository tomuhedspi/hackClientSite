<!DOCTYPE html>
<html lang="en">
<head>
  <title>Thêm Từ Vựng Hán Tự Hack Não BK</title>
  <link rel="icon" type="image/x-icon" href="https://nhotuvung.io.vn/favicon.ico">
  <meta charset="utf-8">
  <meta name="description" content="Đóng góp vào kho từ vựng. Ghi lại những từ vựng tiếng Nhật với cách nhớ nhanh chóng và lâu dài.">
  <meta name="keywords" content="phương pháp học hiệu quả, tiếng nhật, hack não, kanji, hán tự, từ vựng qua hình ảnh, học nhanh, nhớ lâu">
  <meta name="application-name" content="Hack Não BK Tiếng Nhật">
  <meta name="author" content="Hack Nao BK">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Thêm Từ Vựng Tiếng Nhật Hack Não BK">
  <meta property="og:type" content="article" />
  <meta property="og:description" content="Đóng góp vào kho từ vựng. Ghi lại những từ vựng tiếng Nhật với cách nhớ nhanh chóng và lâu dài.">
  <meta property="og:image" content="https://nhotuvung.io.vn/image/icon.png">
  <meta property="og:url" content="https://nhotuvung.io.vn/addjapanese.html">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
  <script src="common.js"></script>
  <script src="navbar.js"></script>
  <link rel="stylesheet" href="mystyle.css">
  <style>
    @media (max-width: 767px) {
      .hint-column {
        width: 50%;
      }
    }
    @media (min-width: 768px) {
      .hint-column {
        width: 25%;
      }
    }
  </style>
  <script>
    $(document).ready(function(){
      ignoreEnter();
      setDefaultMyname();
    });
  </script>
</head>
<body>

<div id="navbar"></div>

<div class="container-fluid">
  <div class="row content">
    <div class="col-sm-9">
      <div class="page_title">
        <h1 id="pageheaderpc">Đóng góp Hán Tự</h1>
      </div>
      <br>
      <form id="myForm">
        <div class="form-group">
          <label for="myword" id="mywordlabel">Hán tự 漢字</label>
          <input type="text" class="form-control" id="myword" placeholder="日" maxlength="255" required onchange="setButtonDisable();">
        </div>
        <div class="form-group">
          <label for="myreading" id="myreadinglabel">Phiên âm Hán Việt</label>
          <input type="text" class="form-control" id="myreading" placeholder="NHẬT" maxlength="255" required onchange="setButtonDisable();">
        </div>
        <div class="form-group">
          <label for="mymeaning">Nghĩa tiếng Việt</label>
          <input type="text" class="form-control" id="mymeaning" placeholder="Nghĩa của từ" maxlength="255" required onchange="setButtonDisable();">
        </div>
        <div class="form-group">
          <label for="mynote">Cách nhớ gợi ý</label>
          <textarea class="form-control" id="mynote" rows="3"placeholder="trời giống Hình Chữ Nhật ロ, bị chia làm đôi 一 : nửa trên là Ngày 日, nửa dưới là đêm" maxlength="1000"  onchange="setButtonDisable();"></textarea>
        </div>
        <div class="form-group" id ="kun">
          <label for="mykun">Âm kun</label>
          <input type="text" class="form-control" id="mykun" placeholder="RYOKU, RIKI" maxlength="255">
        </div>
        <div class="form-group" id ="on">
          <label for="myon">Âm on</label>
          <input type="text" class="form-control" id="myon" placeholder="chikara" maxlength="255">
        </div>
        <div class="form-group" id ="child">
          <label for="mychild">Bộ thủ</label>
          <input type="text" class="form-control" id="mychild" placeholder="十又一尢" maxlength="255">
        </div>
        <div class="form-group">
          <div class="row">
            <div class="col-10"></div>
            <div class="col-2 text-right">
              <input type="text" id="myname" class="form-control" placeholder="member" style="font-size: xx-small; width: 100%; border: none; text-align: right;" onchange="saveMyName(this.value)">
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-between">
          <button id ="submitButton" class="btn btn-primary" type="submit" onclick="submitWord(1);" disabled><i class="fa fa-paper-plane"></i></button> 
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>

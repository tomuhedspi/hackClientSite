<!DOCTYPE html>
<html lang="en">
<head>
  <title>Từ Theo Giáo Trình Hack Não BK</title>
  <meta charset="utf-8">
  <meta name="description" content="Từ vựng từ bài 1 đến bài 50 được lấy từ giáo trình Minna no Nihongo và bao gồm cả các cấp độ N1, N2 và N3 của Mimikara oboeru trong Tiếng Nhật.">
  <meta name="keywords" content="phương pháp học hiệu quả, tiếng nhật, hack não, kanji, hán tự, từ vựng qua hình ảnh, học nhanh, nhớ lâu">
  <meta name="application-name" content="Hack Não BK Tiếng Nhật">
  <meta name="author" content="Hack Nao BK">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Từ Theo Giáo Trình Hack Não BK">
  <meta property="og:type" content="article" />
  <meta property="og:description" content="Từ vựng từ bài 1 đến bài 50 được lấy từ giáo trình Minna no Nihongo và bao gồm cả các cấp độ N1, N2 và N3 của Mimikara oboeru trong Tiếng Nhật.">
  <meta property="og:image" content="https://nhotuvung.io.vn/image/icon.png">
  <meta property="og:url" content="https://nhotuvung.io.vn/unit.html">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
  <script src="common.js"></script>
  <script src="navbar.js"></script>
  <link rel="stylesheet" href="mystyle.css">
  <style>
    @media (min-width: 768px) {
      #scroll_word {
        height: auto;
        max-height: calc(100vh - 220px);
      }
    }
  </style>

  <script>
    $(document).ready(function(){
      setUnit();
      setDefaultMyname();
      loadMoreword();
      setScrollEvent();
    });
  </script>
</head>
<body>
  <div id="navbar"></div>

  <div class="container-fluid">
    <div class="row content">
      <div class="col-sm-3 sidenav">
        <div class="page_title">
          <h2 id="pageheadersp">Từ Vựng Theo Bài</h2>
        </div>
        <div class="unit-label-mobile-wrap">
          <span id="unitLabelMobile" class="unit-label">Bài 1</span>
        </div>
        <!-- unitLabel moved to main detail area -->
        <div class="mt-2 toggle-buttons-container">
          <button id="btnShowWords" type="button" class="toggle-btn active" onclick="showWordList();">Danh sách từ</button>
          <button id="btnShowUnits" type="button" class="toggle-btn inactive" onclick="showUnits();">Bài học</button>
        </div>
        <div id="scroll_word" class="vocabulary-list-card" style="overflow: auto; padding: 0.35rem;">
          <table id="myTable" class="table table-hover vocabulary-word-table">
            <colgroup>
              <col span="1" style="width: 30%;">
              <col span="1" style="width: 70%;">
            </colgroup>
            <tbody id="word_table" style="font-size: small;">
            </tbody>
          </table>
          <div id="unitsList" class="collapse"></div>
        </div>
      </div>

      <div class="col-sm-9">
        <h1 id="pageheaderpc">Từ Vựng Theo Bài</h1>
        <div class="mb-3 unit-label-desktop-wrap">
          <span id="unitLabel" class="unit-label">Bài 1</span>
        </div>
        <hr>
        <input type="hidden" id="word_id" value="1">
        <div style="display:none" id="word_next"></div>
        <div style="display:none" id="word_prev"></div>
        <div style="width: 100%;display: block;">
          <div id="word_reading" class="word_readingstl"></div>
          <div id="word_text" class="word_textstl"></div>
          <div id="word_meaning" class="word_meaningstl"></div>
          <div id="word_note" class="word_notestl"></div>
        </div>
        <img id="word_image" src="image/default.jpg" alt="new word" style="max-height: 400px;max-width: 100%; height: auto;">
        
        <!-- Navigation Buttons -->
        <div class="word-navigation-buttons" style="display: none;">
          <button class="prev-word-btn" onclick="getPreviousWord()">← Từ Trước</button>
          <button class="next-word-btn" onclick="getNextWord()">Từ Tiếp →</button>
        </div>
        
        <div id="div_comment">
          <p id="comment_title">Comment:</p>
          <div class="mt-3">
            <table id="table_comment" class="table table-striped mb-0">

              <tbody style="font-size: small;">
              </tbody>
            </table>
          </div>
        </div>

        <div class="mt-2 comment-input-area">
          <div class="input-group input-row">
            <input type="text" name="mycomment" id="mycomment" class="form-control" placeholder="Góp ý của bạn">
            <div class="input-group-append">
              <button class="btn btn-primary" type="submit" onclick="submitComment();"><i class="fa fa-paper-plane"></i></button>
            </div>
          </div>
          <input type="text" id="myname" class="form-control comment-name mt-2" placeholder="メンバー" onchange="saveMyName(this.value)">
        </div>
      </div>
    </div>
  </div>
</body>
</html>

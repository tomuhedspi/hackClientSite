<!DOCTYPE html>
<html lang="en">
<head>
  <title>Thêm từ mới tiếng Anh Hack Não BK</title>
  <link rel="icon" type="image/x-icon" href="https://hacknaobk.icu/favicon.ico">
  <meta charset="utf-8">
  <meta name="description" content="Contribute to the vocabulary database. Record English words with quick and long-lasting memory techniques.">
  <meta name="keywords" content="effective learning methods, English, hack não, vocabulary through images, learn fast, remember long">
  <meta name="application-name" content="Hack Não BK English">
  <meta name="author" content="Hack Nao BK">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Thêm từ mới tiếng Anh Hack Não BK">
  <meta property="og:type" content="article" />
  <meta property="og:description" content="Contribute to the vocabulary database. Record English words with quick and long-lasting memory techniques.">
  <meta property="og:image" content="https://hacknaobk.icu/image/icon.png">
  <meta property="og:url" content="https://hacknaobk.icu/addenglish.html">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
  <script src="common.js"></script>
  <script src="navbar.js"></script>
  <link rel="stylesheet" href="mystyle.css">
  <style>
    @media (max-width: 767px) {
      .hint-column {
        width: 50%;
      }
    }
    @media (min-width: 768px) {
      .hint-column {
        width: 25%;
      }
    }
    .input-group .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      display: none;
    }
    .input-group input:focus + .clear-btn,
    .input-group input:not(:placeholder-shown) + .clear-btn {
      display: block;
    }
    /* CSS để loại bỏ border của input_new_word */
    #input_new_word {
      border: none;
      box-shadow: none;
    }
    /* CSS để thêm border cho wordInfomationGroup */
    #wordInfomationGroup {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0; /* Đặt padding bằng 0 */
      margin: 0; /* Đặt margin bằng 0 */
    }
  </style>
  <script>
    $(document).ready(function(){
      ignoreEnter();
      setDefaultMyname();
    });

    function clearInput() {
      document.getElementById('input_new_word').value = '';
      document.getElementById('input_new_word').focus();
    }
  </script>
</head>
<body>

<div id="navbar"></div>

<div class="container-fluid">
  <div class="row content">
    <div class="col-sm-3 sidenav">
      <input type="hidden" id="combo" name="combo" value="0">
      <div class="input-group mb-3" style="margin-top: 10px; position: relative;" id="wordInfomationGroup">
        <input type="text" class="form-control" required placeholder="e.g., hello" id="input_new_word" onkeyup="GetEnglishWordInformationListener();">
        <div class="input-group-append">
          <button class="btn btn-xs btn-default" onclick="clearInput();" id="btn_search"><i class="fa fa-times"></i></button>
          <button class="btn btn-primary" onclick="getEnglishWordInformation();" id="btn_search"><i class="fas fa-search"></i></button>
        </div>
      </div>
      <div id="result_list" style="overflow: auto;">
        <table id="myTable" class="table table-hover">
          <colgroup>
            <col span="1" style="width: 30%;">
            <col span="1" style="width: 70%;">
          </colgroup>
          <tbody id="word_table" style="font-size: small;">
          </tbody>
        </table>
      </div>
    </div>

    <div class="col-sm-9">
      <div class="page_title">
        <h1 id="pageheaderpc">Thêm cách nhớ từ vựng tiếng Anh</h1>
      </div>
      <br>
      <form id="myForm">
        <div class="form-group">
          <label for="myword" id="mywordlabel">Từ vựng</label>
          <input type="text" class="form-control" id="myword" placeholder="love" maxlength="255" required onchange="setButtonDisable();">
        </div>
        <div class="form-group">
          <label for="myreading" id="myreadinglabel">Phiên âm</label>
          <input type="text" class="form-control" id="myreading" placeholder="/lʌv/" maxlength="255" required onchange="setButtonDisable();">
        </div>
        <div class="form-group">
          <label for="mymeaning">Nghĩa</label>
          <input type="text" class="form-control" id="mymeaning" placeholder="yêu" maxlength="255" required onchange="setButtonDisable();">
        </div>
        <div class="form-group">
          <label for="mynote">Gợi ý cách nhớ</label>
          <textarea class="form-control" id="mynote" rows="3" placeholder="vì YÊU em nên mới LẮP cho em bộ đồ chơi này đó" maxlength="1000" onchange="setButtonDisable();"></textarea>
        </div>
        <div class="form-group">
          <div class="row">
            <div class="col-10"></div>
            <div class="col-2 text-right">
              <input type="text" id="myname" class="form-control" placeholder="member" style="font-size: xx-small; width: 100%; border: none; text-align: right;" onchange="saveMyName(this.value)">
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-between">
          <button id="submitButton" class="btn btn-primary" type="submit" onclick="submitWord(2);" disabled><i class="fa fa-paper-plane"></i></button> 
          <button class="btn btn-primary" type="button" onclick="getHintForWordEnglish();">Get Hint</button>
        </div>
        <div id="hint_text" class="row">
          <div class="col-sm-3 hint-column" id="hint_text_1"></div>
          <div class="col-sm-3 hint-column" id="hint_text_2"></div>
          <div class="col-sm-3 hint-column" id="hint_text_3"></div>
          <div class="col-sm-3 hint-column" id="hint_text_4"></div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>

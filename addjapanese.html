<!DOCTYPE html>
<html lang="en">
<head>
  <title>Thêm Từ Vựng Tiếng Nhật Hack Não BK</title>
  <link rel="icon" type="image/x-icon" href="https://nhotuvung.io.vn/favicon.ico">
  <meta charset="utf-8">
  <meta name="description" content="Đóng góp vào kho từ vựng. Ghi lại những từ vựng tiếng Nhật với cách nhớ nhanh chóng và lâu dài.">
  <meta name="keywords" content="phương pháp học hiệu quả, tiếng nhật, hack não, kanji, hán tự, từ vựng qua hình ảnh, học nhanh, nhớ lâu">
  <meta name="application-name" content="Hack Não BK Tiếng Nhật">
  <meta name="author" content="Hack Nao BK">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Thêm Từ Vựng Tiếng Nhật Hack Não BK">
  <meta property="og:type" content="article" />
  <meta property="og:description" content="Đóng góp vào kho từ vựng. Ghi lại những từ vựng tiếng Nhật với cách nhớ nhanh chóng và lâu dài.">
  <meta property="og:image" content="https://nhotuvung.io.vn/image/icon.png">
  <meta property="og:url" content="https://nhotuvung.io.vn/addjapanese.html">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.3/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
  <script src="common.js"></script>
  <script src="navbar.js"></script>
  <link rel="stylesheet" href="mystyle.css">
  <style>
    /* Center page and improve input/text prominence */
    :root{
      --page-bg: #f6f8fb;
      --accent: #3b82f6;
      --muted: #6b7280;
      --input-border: rgba(59,130,246,0.18);
      --input-focus-shadow: rgba(59,130,246,0.12);
    }
    body{ background: var(--page-bg); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial; color:#0f172a; }
    .center-page{ display:flex; justify-content:center; padding:24px 12px; }
    .content{ width:100%; max-width:980px; }
    .page_title h1{ font-size:1.5rem; color:var(--accent); font-weight:700; margin-bottom:0; }
    label{ font-weight:700; color:#111827; }
    .form-control{ border-radius:10px; padding:.7rem .85rem; font-size:1rem; background:linear-gradient(180deg,#fff,#fbfdff); border:1px solid var(--input-border); color:#021124; }
    .form-control:focus{ outline:none; border-color:var(--accent); box-shadow:0 8px 24px var(--input-focus-shadow); }
    textarea.form-control{ min-height:120px; }
    .hint-column{ padding:.5rem; }
    .hint-box{ background:#fff; border-radius:10px; padding:.6rem; min-height:56px; border:1px solid rgba(0,0,0,0.04); box-shadow:0 6px 18px rgba(2,6,23,0.03); color:#0b1220; }
    #myname{ font-size:.9rem; text-align:right; border:none; background:transparent; color:var(--muted); width:120px; }
    .btn-primary, .btn-outline-secondary{ border-radius:10px; }
    @media (max-width:767px){ .hint-column{ width:50%; } .content{ padding:0 8px; } #myname{ width:90px; } }
    @media (min-width:768px){ .hint-column{ width:25%; } }
  </style>
  <script>
    $(document).ready(function(){
      ignoreEnter();
      setDefaultMyname();
    });
  </script>
</head>
<body>

<div id="navbar"></div>

<div class="container-fluid center-page">
  <div class="row content">
    <div class="col-sm-9">
      <div class="page_title">
        <h2 id="pageheadersp">Đóng góp từ vựng</h2>
        <h1 id="pageheaderpc">Đóng góp từ vựng</h1>
      </div>
      <br>
      <form id="myForm">
        <div class="form-group">
          <label for="myword" id="mywordlabel">Từ Vựng( Viết bằng Chữ hán hoặc Hiragana)</label>
          <input type="text" class="form-control" id="myword" placeholder="勉強" maxlength="255" required onchange="setButtonDisable();">
        </div>
        <div class="form-group">
          <label for="myreading" id="myreadinglabel">Cách đọc( Viết bằng Hiragana)</label>
          <input type="text" class="form-control" id="myreading" placeholder="べんきょう" maxlength="255" required onchange="setButtonDisable();">
        </div>
        <div class="form-group">
          <label for="mymeaning">Nghĩa tiếng Việt</label>
          <input type="text" class="form-control" id="mymeaning" placeholder="Học" maxlength="255" required onchange="setButtonDisable();">
        </div>
        <div class="form-group">
          <label for="mynote">Cách nhớ gợi ý</label>
          <textarea class="form-control" id="mynote" rows="3"placeholder="BÊN CÔ em HỌC hành nghiêm túc hơn hẳn" maxlength="1000"  onchange="setButtonDisable();"></textarea>
        </div>
        <div class="form-group" id ="kun" style="display: none;">
          <label for="mykun">Âm kun</label>
          <input type="text" class="form-control" id="mykun" placeholder="RYOKU, RIKI" maxlength="255">
        </div>
        <div class="form-group" id ="on" style="display: none;">
          <label for="myon">Âm on</label>
          <input type="text" class="form-control" id="myon" placeholder="chikara" maxlength="255">
        </div>
        <div class="form-group">
          <div class="row">
            <div class="col-10"></div>
            <div class="col-2 text-right">
              <input type="text" id="myname" class="form-control" placeholder="member" style="font-size: xx-small; width: 100%; border: none; text-align: right;" onchange="saveMyName(this.value)">
            </div>
          </div>
        </div>
        <div class="d-flex justify-content-between">
          <button id ="submitButton" class="btn btn-primary" type="submit" onclick="submitWord(0);" disabled><i class="fa fa-paper-plane"></i></button> 
          <button class="hint-btn" type="button" onclick="getHintForWordJapanese();">Xem Gợi Ý Cách Nhớ</button>
        </div>
        <div id="hint_text" class="row">
          <div class="col-sm-3 hint-column" id="hint_text_1"></div>
          <div class="col-sm-3 hint-column" id="hint_text_2"></div>
          <div class="col-sm-3 hint-column" id="hint_text_3"></div>
          <div class="col-sm-3 hint-column" id="hint_text_4"></div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
